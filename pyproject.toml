[project]
name = "black-number"
version = "0.1.0"
description = "Black Number — a voice-activated, self-improving personal assistant."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Layered so a bare clone runs with zero installs. Add extras as you enable
# capabilities: `pip install -e '.[anthropic,macspeech]'`
anthropic = ["anthropic>=0.40"]
macspeech = ["pyobjc-framework-Speech>=10.0", "pyobjc-framework-AVFoundation>=10.0"]
web = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
blacknumber = "black_number.__main__:main"
bn = "black_number.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
